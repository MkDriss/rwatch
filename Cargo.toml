[package]
name = "rwatch"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "rwatch : IDS réseau en Rust (capture, détection par règles, alertes JSON)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MkDriss/rwatch"
keywords = ["ids", "pcap", "security", "iot", "arp"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4", features = ["derive"] }
etherparse = "0.21"
pcap = "2"
rnifler = { git = "https://github.com/MkDriss/rnifler", tag = "v1.2.0", version = "1.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
