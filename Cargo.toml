[package]
name = "rwatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
clap = { version = "4", features = ["derive"] }
etherparse = "0.21"
pcap = "2"
rnifler = { git = "https://github.com/MkDriss/rnifler", tag = "v1.1.0", version = "1.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
